{% extends "base.html" %}
{% block content %}
<style>
    .profile-viewport {
        height: 100vh;
        width: 100%;
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('{{ url_for('static', filename='admin.jpg') }}');
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden; 
    }
    .edit-card {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 50px;
        width: 100%;
        max-width: 500px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header-text { 
        font-family: 'Science Gothic'; 
        font-weight: 800; 
        color: white; 
        letter-spacing: -1px;
    }
    .technical-label { 
        font-family: 'B612 Mono'; 
        font-size: 0.7rem; 
        color: #2ecc71; 
        text-transform: uppercase;
        margin-bottom: 5px;
    }
    .form-control-custom {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-family: 'B612 Mono';
        padding: 12px;
    }
    .form-control-custom:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: #2ecc71;
        color: white;
        box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
    }
</style>

<div class="profile-viewport">
    <div class="edit-card">
        <div class="text-center mb-5">
            <h2 class="header-text">EDIT GUIDE DETAILS</h2>
            <div class="bg-warning mx-auto" style="height: 2px; width: 40px;"></div>
        </div>

        <form action="{{ url_for('edit_staff_profile') }}" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="technical-label">user_id</label>
                    <input type="number" name="user_id" class="form-control form-control-custom w-100" value="{{ staff.user_id }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="technical-label">Lead name</label>
                    <input type="text" name="name" class="form-control form-control-custom w-100" value="{{ staff.name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="technical-label">Ur Email</label>
                    <input type="email" name="email" class="form-control form-control-custom w-100" value="{{ staff.email }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="technical-label">Phone</label>
                    <input type="text" name="phone" class="form-control form-control-custom w-100" value="{{ staff.phone or '' }}">
                </div>
                <div class="col-md-12 mb-3">
                    <label class="technical-label"> change preferred-region ?</label>
                    <input type="text" name="preferred_region" class="form-control form-control-custom w-100" 
                           value="{{ staff.preferred_region or '' }}" placeholder="e.g., Western Ghats,Kashmir">
                </div>
                <div class="col-md-12 mb-4">
                    <label class="technical-label">change Password ?</label>
                    <input type="password" name="password" class="form-control form-control-custom w-100" placeholder="skip to retain old">
                </div>
            </div>

            <div class="d-grid gap-3">
                <button type="submit" class="btn btn-warning fw-bold py-3 text-dark" style="letter-spacing: 1px;">
                    update my profile
                </button>
                <a href="{{ url_for('staff_dashboard',user_id=staff.user_id )}}" 
                   class="btn btn-link text-white text-decoration-none small opacity-50 technical-label text-center">
                    <i class="bi bi-arrow-left"></i> back to my dashboard
                </a>
            </div>
        </form>        
    </div>
</div>
{% endblock %}
