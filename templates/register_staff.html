{% extends "base.html" %}
{% block content %}
<style>
    body {
        background-image:url("{{ url_for('static', filename='regstaff.jpg') }}");
        background-size: 750px;
        height: 95vh;
        background-repeat: no-repeat;
        background-position-y: bottom;
        background-position-x: right;
    }
    .context{
        width: 400px;
        height: 700px;
        background-color: rgba(250, 247, 247, 0.781);   
    }
</style>
<div class="context">
    <h2 class="heading">Staff Registration</h2>
    <form method="POST" action="{{url_for('register_staff')}}">
        <div>
            <label for="name">Name :</label><br>
            <input type="text" id="name" name="name" required>
        </div>
        <br>
        <div>
            <label for="email">Email :</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>
        <div>
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit number" required>
        </div>
        <br>
        <div>
            <label for="user_id">USER ID  :</label><br>
            <input type="text" name="user_id" required>
        </div>
        <br>
        <div>
            <label for="password">Password :</label><br>
            <input type="password" id="password" name="password" required>
        </div>
        <br>
        <div id="staff-fields"><label class="small " style="font-family: 'Segoe UI';color: black;font-weight: bolder;
        font-style: oblique;">Preference </label>
            <select name="preferred_region" class="form-select bg-black text-white border-secondary mb-3">
                <option value="Western Ghats">Western Ghats</option>
                <option value="Himachal">Himachal</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="Nepal">Nepal</option>
            </select>
        </div>
        <button type="submit" class="button-primary">Register</button>
    </form>
    <p class="u-text-centre"><em>Note : Staff/Lead registrations -> u require admin approval before logging in </em></p>
</div>
{% endblock %}
