{% extends "base.html" %}
{% block content %}
<style>
    body {
        background-image:url("{{ url_for('static', filename='regstaff.jpg') }}");
        background-size: cover;
        background-position-y: top;
    }
    .context{
        width: 400px;
        height: 700px;
        background-color: rgba(250, 247, 247, 0.781);   
    }
</style>
<div class="context">
    <h2 class="heading">Staff Registration</h2>
    <form method="POST" action="{{url_for('register_staff')}}">
        <div>
            <label for="name">Name :</label><br>
            <input type="text" id="name" name="name" required>
        </div>
        <br>
        <div>
            <label for="email">Email :</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>
        <div>
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit number" required>
        </div>
        <br>
        <div>
            <label for="user_id">USER ID  :</label><br>
            <input type="text" name="user_id" required>
        </div>
        <br>
        <div>
            <label for="password">Password :</label><br>
            <input type="password" id="password" name="password" required>
        </div>
        <br>
        <button type="submit" class="button-primary">Register</button>
    </form>
    <p class="u-text-centre"><em>Note : Staff/Lead registrations -> require admin approval before logging in </em></p>
</div>
{% endblock %}
