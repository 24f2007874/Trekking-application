{% extends "base.html" %}

{% block content %}
<style>
    body { background-image: url("{{ url_for('static', filename='admin.jpg') }}"); }
    .admin-sidebar {
        width: 250px; position: fixed; top: 0; left: 0; height: 100vh;
        background: rgba(10, 52, 22, 0.521); border-right: 3px solid rgba(240, 220, 36, 0.822);
        padding-top: 100px; z-index: 100;
        color: #ffc107;
    }
    .main-pane { margin-left: 260px; padding: 120px 6% 50px 6%; color: #ffc107;}
    /* Glassmorphism Form Style */
    .form-glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px; padding: 40px;
    }
    /* Technical Typography */
    label { font-family: 'B612 Mono', monospace; font-size: 0.7rem; color: #ffc107; text-transform: uppercase; margin-bottom: 10px; display: block; }
    h1 { font-family: 'Science Gothic', sans-serif; font-weight: 800; letter-spacing: -1px; }
    
    .form-control, .form-select { 
        background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; 
        border-radius: 8px; padding: 12px;
    }
    .form-control:focus, .form-select:focus { 
        background: rgba(0,0,0,0.5); border-color: #ffc107; color: white; box-shadow: none; 
    }
</style>
<!-- Persistent Admin Sidebar -->
<div class="admin-sidebar">
    <div class="px-4 mb-5">
        <h5 class="fw-bold" style="font-family: 'Science Gothic';">ADMIN CONSOLE</h5>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link text-white-50 px-4 py-3" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
        <a class="nav-link text-warning px-4 py-3 active" href="#"><i class="bi bi-mountain me-2"></i> Manage Treks</a>
        <a class="nav-link text-white-50 px-4 py-3" href="#"><i class="bi bi-people me-2"></i> Staff Management</a>
        <a class="nav-link text-white-50 px-4 py-3" href="#"><i class="bi bi-person-circle me-2"></i> User Registry</a>
    </nav>
</div>
<div class="main-pane">
    <div class="mb-5">
        <h1>{{ 'EDIT TREK ROUTE' if trek else 'INITIALIZE NEW TREK' }}</h1>
    </div>

    <div class="glass-card">
        <form action="{{ url_for('edit_trek', trek_id=trek.id) if trek else url_for('create_trek') }}" method="POST">
            <div class="row g-4">
                <div class="col-md-8">
                    <label>Trek Name</label>
                    <input type="text" name="name" class="form-control" value="{{ trek.trek_name if trek else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label>Region</label>
                    <select name="region" class="form-select" required>
                        {% for r in ['Nepal', 'Himachal', 'Uttarakhand', 'Western Ghats','Kerla'] %}
                        <option value="{{ r }}" {{ 'selected' if trek and trek.region == r }}>{{ r }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Starting Location</label>
                    <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label>Duration</label>
                    <input type="number" name="duration" class="form-control" value="{{ trek.duration if trek else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label>Difficulty</label>
                    <select name="difficulty" class="form-select">
                        {% for d in ['Easy', 'Moderate', 'Hard', 'Expert'] %}
                        <option value="{{ d }}" {{ 'selected' if trek and trek.difficulty == d }}>{{ d }}</option>
                        {% endfor %}
                    </select>
                </div>
                <!-- using date format here,,easy for histroy tracking and so on,,
                 dont touch this section , working rn !!!-->
                <div class="col-md-6">
                    <label>Start Date</label>
                    <input type="date" name="start_date" class="form-control" 
                           value="{{ trek.start_date.strftime('%Y-%m-%d') if trek else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label>End Date</label>
                    <input type="date" name="end_date" class="form-control" 
                           value="{{ trek.end_date.strftime('%Y-%m-%d') if trek else '' }}" required>
                </div>

                <!-- Staff Assignment  -->
                <div class="col-md-4">
                    <label>Total Slots</label>
                    <input type="number" name="slots" class="form-control" value="{{ trek.total_slots if trek else '' }}" required>
                </div>
                <!--dont touch this too working rn...-->
                <div class="col-md-8">
                    <label>Assign Lead  (By Preference)</label>
                    <select name="staff_id" class="form-select" required>
                        <option value="">-- Choose Approved Staff --</option>
                        {% for s in staff %}
                        <option value="{{ s.user_id }}" {{ 'selected' if trek and trek.assigned_staff_id == s.user_id }}>
                            {{ s.name }} (Prefers: {{ s.preferred_region if s.preferred_region else 'General' }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Operational Status</label>
                    <select name="status" class="form-select">
                        {% for st in ['Open', 'Closed', 'Pending', 'Completed'] %}
                        <option value="{{ st }}" {{ 'selected' if trek and trek.status == st }}>{{ st }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-8">
                    <label>Mountain Imagery</label>
                    <select name="image_file" class="form-select">
                        {% if images %}
                            {% for img in images %}
                            <option value="{{ img }}" {{ 'selected' if trek and trek.image_file == img }}>{{ img }}</option>
                            {% endfor %}
                        {% elif trek %}
                            <option value="{{ trek.image_file }}">{{ trek.image_file }} (Current)</option>
                        {% endif %}
                    </select>
                </div>

                <div class="col-12">
                    <label>Description & Itinerary</label>
                    <textarea name="description" class="form-control" rows="5">{{ trek.description if trek else '' }}</textarea>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-warning fw-bold px-5 py-3 me-2">
                        {{ 'UPDATE DETAILS' if trek else 'INITIALIZE TREK' }}
                    </button>
                    <a href="{{ url_for('manage_treks') }}" class="btn btn-outline-light px-5 py-3">CANCEL</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
