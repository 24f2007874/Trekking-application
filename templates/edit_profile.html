{% extends "base.html" %}
{% block content %}
<style>
    .profile-viewport {
        height: 100vh;
        width: 100%;
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                          url('{{ url_for('static', filename='admin.jpg') }}');
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden; 
    }
    .edit-card {
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 50px;
        width: 100%;
        max-width: 500px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header-text { 
        font-family: 'Science Gothic'; 
        font-weight: 800; 
        color: white; 
        letter-spacing: -1px;
    }
    .technical-label { 
        font-family: 'B612 Mono'; 
        font-size: 0.7rem; 
        color: #2ecc71; 
        text-transform: uppercase;
        margin-bottom: 5px;
    }
    .form-control-custom {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-family: 'B612 Mono';
        padding: 12px;
    }
    .form-control-custom:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: #2ecc71;
        color: white;
        box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
    }
</style>

<div class="profile-viewport">
    <div class="edit-card">
        <div class="text-center mb-5">
            <h2 class="header-text">EDIT UR DETAILS</h2>
            <div class="bg-success mx-auto" style="height: 2px; width: 40px;"></div>
        </div>
        <form action="{{ url_for('edit_profile') }}" method="POST">
            <div class="mb-4">
                <label class="technical-label d-block">Trekker Name</label>
                <input type="text" name="name" class="form-control form-control-custom" 
                       value="{{ user.name }}" required>
            </div>
            <div class="mb-4">
                <label class="technical-label d-block">Ur Email :</label>
                <input type="email" name="email" class="form-control form-control-custom" 
                       value="{{ user.email }}" required>
            </div>
            <div class="mb-5">
                <label class="technical-label d-block">Password Key </label>
                <input type="password" name="password" class="form-control form-control-custom" 
                       placeholder="••••••••">
            </div>
            <div class="d-grid gap-3">
                <button type="submit" class="btn btn-success fw-bold py-3" style="letter-spacing: 1px;">
                    SAVE UPDATES
                </button>
                <a href="{{ url_for('user_dashboard', user_id=user.user_id) }}" 
                   class="btn btn-link text-white text-decoration-none small opacity-50">
                    <i class="bi bi-arrow-left"></i> Return to Ur Dashboard
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
